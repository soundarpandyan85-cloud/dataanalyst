<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="description" content="A simple client-side calculator">
</head>
<body>
    <main class="app">
        <h1>SOUNDARS Calculator</h1>
        <div class="calculator">
            <input id="display" class="display" type="text" readonly aria-label="Calculator display">
            <div class="keys">
                <button class="key op" data-action="clear">C</button>
                <button class="key op" data-action="del">⌫</button>
                <button class="key op" data-value="/">÷</button>
                <button class="key op" data-value="*">×</button>

                <button class="key" data-value="7">7</button>
                <button class="key" data-value="8">8</button>
                <button class="key" data-value="9">9</button>
                <button class="key op" data-value="-">−</button>

                <button class="key" data-value="4">4</button>
                <button class="key" data-value="5">5</button>
                <button class="key" data-value="6">6</button>
                <button class="key op" data-value="+">+</button>

                <button class="key" data-value="1">1</button>
                <button class="key" data-value="2">2</button>
                <button class="key" data-value="3">3</button>
                <button class="key equal" data-action="equals">=</button>

                <button class="key zero" data-value="0">0</button>
                <button class="key" data-value=".">.</button>
            </div>
        </div>
        <p class="hint">You can also use your keyboard to type expressions.</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
